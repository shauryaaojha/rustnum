name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --all-features

      - name: Test (no default features)
        run: cargo test --no-default-features

      - name: Doc
        run: cargo doc --no-deps

  # Compares rustnum with real NumPy: .npy/.npz interop and the parity fixtures.
  python:
    name: NumPy parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy
        run: python -m pip install numpy

      - name: Generate fixtures
        run: |
          if [ -f tools/gen_fixtures.py ]; then
            python tools/gen_fixtures.py
          else
            echo "tools/gen_fixtures.py not found yet; skipping fixture generation"
          fi

      - name: Parity tests
        run: |
          if [ -f rustnum/tests/parity.rs ]; then
            cargo test -p rustnum --test parity -- --nocapture
          else
            echo "rustnum/tests/parity.rs not found yet; skipping"
          fi

      # The unit tests of the zip/deflate layer and the npy/npz round trips call `python`
      # themselves and skip quietly when NumPy is missing, so run them here where it is present.
      - name: Python round-trip tests
        run: |
          cargo test -p rustnum --lib npz
          if [ -f rustnum/tests/npy_python.rs ]; then
            cargo test -p rustnum --test npy_python
          fi
